apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-buddy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mojojojo0222/notes_buddy
    targetRevision: HEAD
    path: helm/notes-buddy
    helm:
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: notes-buddy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
