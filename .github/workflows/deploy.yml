name: Build and Push to ECR

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'helm/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: notes-buddy
  CHART_VALUES: helm/notes-buddy/values-staging.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::083777493383:role/notes-buddy-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Bump image tag in helm chart
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if grep -q '^  tag:' "$CHART_VALUES"; then
            sed -i "s|^  tag:.*|  tag: $IMAGE_TAG|" "$CHART_VALUES"
          else
            sed -i "s|^  pullPolicy: Always|  pullPolicy: Always\n  tag: $IMAGE_TAG|" "$CHART_VALUES"
          fi
          git diff "$CHART_VALUES"

      - name: Commit back chart bump
        run: |
          if ! git diff --quiet "$CHART_VALUES"; then
            git config user.name "ci-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "$CHART_VALUES"
            git commit -m "ci: bump staging image tag to ${{ github.sha }} [skip ci]"
            git push origin main
          else
            echo "No chart change to commit"
          fi
